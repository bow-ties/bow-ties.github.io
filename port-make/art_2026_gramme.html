<h3>Gramme Machine Research (2026)</h3>

<p>
My research into the Gramme Machine is best summarized in the abstract for my talk at the 2026 AAPT Summer Meeting in Pasadena, CA, titled <a href="https://docs.google.com/presentation/d/13-Sv2wxZ9glGsi4ONVDWfq7gnv0CIjcX4v6mwGECJCc/edit?usp=drivesdk">Storytelling of the Gramme Machine Motor-Generator Reciprocity Experiment</a>:
</p>
<p>
Our demonstration collection includes a Gramme machine, one of the first practical electric generators. Due to reciprocity, it also exhibits all the major components of a modern electrical motor. Literature on the history of electrification highlights an event at the 1873 World’s Fair, where two were connected with one acting as a generator and the other as a motor. This experiment was replicated by connecting MIT's device to one in Harvard's Collection of Historical Scientific Instruments as part of a historical experiments seminar class. The device was separately integrated into discussion during motor and generator discovery experiments at the middle school and introductory college levels, alongside presentation of the technology's intermittent development and adoption. We are additionally developing discussion material as modular content with short-form application examples and long-form "deep dives".
</p>
<p>
Includes discussion of using historical instruments to tell narratives that bring out epistemological resources, nature of science beliefs, and questions about the societal adoption of technology - or to simply include relevant technological applications.
</p>
